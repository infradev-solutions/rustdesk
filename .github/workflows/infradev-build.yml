name: InfraDev Remote - gerar instaladores

# Rode manualmente em Actions → "InfraDev Remote - gerar instaladores" → Run workflow.
# Os instaladores saem na release "infradev" deste repositório.
on:
  workflow_dispatch:

# O flutter-build.yml tem jobs que publicam a release (contents: write).
# Em forks o token padrão costuma ser só leitura, e sem isso o workflow nem inicia.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "infradev"

  # Renomeia os instaladores de "rustdesk-*" para "infradev-remote-*" na release.
  # Roda mesmo se algum build falhar, para renomear o que ficou pronto.
  renomear-instaladores:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Renomear arquivos da release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$REPO/releases/tags/infradev" --jq '.assets[] | "\(.id)\t\(.name)"')
          echo "$assets" | while IFS=$'\t' read -r id name; do
            case "$name" in
              rustdesk-*)
                new="infradev-remote-${name#rustdesk-}"
                # Remove a versão antiga com o mesmo nome, se houver (build anterior).
                old_id=$(echo "$assets" | awk -F'\t' -v n="$new" '$2 == n {print $1}')
                if [ -n "$old_id" ]; then
                  gh api -X DELETE "repos/$REPO/releases/assets/$old_id"
                fi
                gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" > /dev/null
                echo "$name -> $new"
                ;;
            esac
          done

  # Copia os instaladores para a release "instaladores" do repositório infradev-remote.
  # Precisa do secret INFRADEV_REMOTE_TOKEN (token com permissão de escrita em Contents
  # no infradev-remote). Sem o secret, este passo é pulado e os arquivos ficam só neste fork.
  publicar-no-infradev-remote:
    needs: renomear-instaladores
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar instaladores no infradev-remote
        env:
          GH_TOKEN: ${{ secrets.INFRADEV_REMOTE_TOKEN }}
          ORIGEM: ${{ github.repository }}
          DESTINO: infradev-solutions/infradev-remote
          TAG: instaladores
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret INFRADEV_REMOTE_TOKEN não configurado; instaladores ficam só na release deste fork."
            exit 0
          fi
          mkdir -p arquivos
          # A release do fork é pública, então dá para baixar com o token do infradev-remote.
          gh release download infradev -R "$ORIGEM" -p 'infradev-remote-*' -D arquivos
          ls -lh arquivos
          if ! gh release view "$TAG" -R "$DESTINO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$DESTINO" --title "InfraDev Remote - instaladores" \
              --notes "Instaladores do InfraDev Remote, já configurados para remote.infradevsolutions.com.br. Gerados automaticamente a partir de $ORIGEM."
          fi
          gh release upload "$TAG" -R "$DESTINO" --clobber arquivos/*
