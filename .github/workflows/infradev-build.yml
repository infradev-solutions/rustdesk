name: InfraDev Remote - gerar instaladores

# Rode manualmente em Actions → "InfraDev Remote - gerar instaladores" → Run workflow.
# Os instaladores saem na release "infradev" deste repositório.
on:
  workflow_dispatch:

# O flutter-build.yml tem jobs que publicam a release (contents: write).
# Em forks o token padrão costuma ser só leitura, e sem isso o workflow nem inicia.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "infradev"
